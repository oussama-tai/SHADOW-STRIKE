<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW STRIKE - Sound Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; color: #fff; display: flex; justify-content: center; align-items: center; }
        #game-wrapper { position: relative; width: 1280px; height: 720px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.15); border: 3px solid #1e293b; background: #000; overflow: hidden; border-radius: 8px; }
        canvas { width: 100%; height: 100%; display: block; }
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
        h1.game-title { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #38bdf8; text-shadow: 0 0 25px rgba(56,189,248,0.6); margin-bottom: 10px; }
        .subtitle { font-size: 18px; color: #9ca3af; letter-spacing: 3px; margin-bottom: 40px; }
        .menu-btn { width: 280px; padding: 14px 24px; margin: 8px; font-size: 18px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #38bdf8; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .menu-btn:hover { background: #38bdf8; color: #0f172a; box-shadow: 0 0 20px rgba(56,189,248,0.5); transform: translateY(-2px); }
        .grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; padding: 20px; max-height: 500px; overflow-y: auto; background: rgba(15, 23, 42, 0.6); border-radius: 8px; border: 1px solid #334155; }
        .grid-container::-webkit-scrollbar { width: 8px; }
        .grid-container::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
        
        .level-card { width: 80px; height: 75px; background: #0f172a; border: 2px solid #334155; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .level-card.unlocked { border-color: #38bdf8; background: #1e293b; }
        .level-card.unlocked:hover { background: #0284c7; transform: scale(1.1); box-shadow: 0 0 15px rgba(56,189,248,0.4); }
        .level-card.boss-level { border-color: #ef4444; }
        .level-card.boss-level.unlocked:hover { background: #b91c1c; box-shadow: 0 0 15px rgba(239,68,68,0.4); }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 5; }
        .hud-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(5px); }
        .bar-container { width: 220px; height: 14px; background: #0f172a; border-radius: 7px; overflow: hidden; margin-top: 5px; border: 1px solid #334155; }
        .bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #16a34a, #22c55e); transition: width 0.15s ease; }
        .dash-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width 0.1s ease; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="hud-card">
                    <div style="font-size: 14px; color: #9ca3af; font-weight: bold;">الصحة (HP)</div>
                    <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
                    <div style="font-size: 14px; color: #9ca3af; margin-top: 8px; font-weight: bold;">الاندفاع (SPACE)</div>
                    <div class="bar-container"><div id="dash-bar" class="dash-bar-fill"></div></div>
                </div>
                <div class="hud-card" style="text-align: center; border-color: #38bdf8;">
                    <div id="wave-text" style="font-size: 22px; font-weight: 900; color: #38bdf8; letter-spacing: 1px;">المرحلة 1</div>
                    <div id="enemies-left" style="font-size: 14px; color: #e5e7eb; margin-top: 4px;">الأعداء المتبقون: 0</div>
                </div>
                <div class="hud-card" style="text-align: left;">
                    <div id="coins-text" style="font-size: 20px; color: #facc15; font-weight: bold;">🪙 0</div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="hud-card">
                    <div id="weapon-name" style="font-size: 16px; font-weight: bold; color: #38bdf8;">مسدس بلازما</div>
                    <div id="ammo-text" style="font-size: 24px; font-weight: 900;">15 / ∞</div>
                </div>
            </div>
        </div>

        <!-- Menus -->
        <div id="menu-start" class="overlay-screen">
            <h1 class="game-title">SHADOW STRIKE</h1>
            <div class="subtitle">نسخة كاملة - 50 مرحلة، أصوات تفاعلية، أرضية فضائية</div>
            <button class="menu-btn" onclick="Game.showLevelSelect()">بدء المهمة</button>
        </div>

        <div id="menu-levels" class="overlay-screen hidden">
            <h1 class="game-title" style="font-size: 40px; margin-bottom: 20px;">اختر المرحلة</h1>
            <div class="grid-container" id="levels-grid"></div>
            <button class="menu-btn" style="margin-top: 25px;" onclick="Game.showStartMenu()">رجوع</button>
        </div>

        <div id="menu-end" class="overlay-screen hidden">
            <h1 id="end-title" class="game-title">انتهت اللعبة</h1>
            <button class="menu-btn" onclick="Game.startLevel(Game.currentLevel)">إعادة المحاولة</button>
            <button class="menu-btn" onclick="Game.showLevelSelect()">قائمة المراحل</button>
        </div>
    </div>

    <script>
        // --- SOUND ENGINE (Web Audio API) ---
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            shoot() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            dash() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            },
            hit() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.06);
            },
            kill() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.18);
            },
            win() {
                if (!this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (i + 1) * 0.1);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + (i + 1) * 0.1);
                });
            },
            lose() {
                if (!this.ctx) return;
                const notes = [300, 240, 180, 120];
                notes.forEach((freq, i) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (i + 1) * 0.12);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.12);
                    osc.stop(this.ctx.currentTime + (i + 1) * 0.12);
                });
            }
        };

        // --- WEAPONS ---
        const WEAPONS = {
            pistol: { name: 'مسدس بلازما', damage: 35, fireRate: 180, magSize: 15, reloadTime: 1000 }
        };

        const Game = {
            canvas: document.getElementById('gameCanvas'),
            ctx: document.getElementById('gameCanvas').getContext('2d'),
            currentLevel: 1,
            maxLevel: 1,
            coins: 0,
            player: null,
            enemies: [],
            bullets: [],
            boss: null,
            keys: {},
            mouse: { x: 0, y: 0, isDown: false },
            isRunning: false,
            enemiesToSpawn: 0,
            spawnTimer: 0,

            init() {
                this.bindEvents();
                this.renderLevelGrid();
                requestAnimationFrame(ts => this.loop(ts));
            },

            bindEvents() {
                window.addEventListener('keydown', e => { 
                    AudioFX.init();
                    this.keys[e.key.toLowerCase()] = true; 
                });
                window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
                
                this.canvas.addEventListener('mousemove', e => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                });
                this.canvas.addEventListener('mousedown', e => { 
                    AudioFX.init();
                    if(e.button===0) this.mouse.isDown = true; 
                });
                window.addEventListener('mouseup', () => { this.mouse.isDown = false; });
            },

            showStartMenu() { this.hideAll(); document.getElementById('menu-start').classList.remove('hidden'); },
            showLevelSelect() { AudioFX.init(); this.hideAll(); this.renderLevelGrid(); document.getElementById('menu-levels').classList.remove('hidden'); },
            hideAll() { document.querySelectorAll('.overlay-screen, #hud').forEach(el => el.classList.add('hidden')); this.isRunning = false; },

            renderLevelGrid() {
                const grid = document.getElementById('levels-grid');
                grid.innerHTML = '';
                for (let i = 1; i <= 50; i++) {
                    const btn = document.createElement('div');
                    const unlocked = i <= this.maxLevel;
                    const isBoss = i % 5 === 0;
                    
                    let classes = 'level-card';
                    if(unlocked) classes += ' unlocked';
                    if(isBoss) classes += ' boss-level';
                    
                    btn.className = classes;
                    btn.innerHTML = `
                        <div style="font-size:22px; font-weight:bold; color:${unlocked ? '#fff' : '#64748b'};">${i}</div>
                        ${isBoss ? '<div style="font-size:12px; margin-top:4px;">💀 زعيم</div>' : ''}
                    `;
                    
                    if(unlocked) btn.onclick = () => this.startLevel(i);
                    grid.appendChild(btn);
                }
            },

            startLevel(lvl) {
                AudioFX.init();
                this.hideAll();
                document.getElementById('hud').classList.remove('hidden');
                this.currentLevel = lvl;
                this.isRunning = true;
                
                this.player = new Player(640, 360);
                this.enemies = [];
                this.bullets = [];
                this.boss = null;
                
                this.enemiesToSpawn = 10 + Math.floor(lvl * 2.5);
                this.spawnTimer = 0;

                if (lvl % 5 === 0) {
                    this.boss = new Boss(640, -100, lvl);
                }
            },

            updateHUD() {
                document.getElementById('hp-bar').style.width = `${Math.max(0, (this.player.hp/this.player.maxHp)*100)}%`;
                document.getElementById('dash-bar').style.width = `${(this.player.dashEnergy/100)*100}%`;
                document.getElementById('wave-text').innerText = `المرحلة ${this.currentLevel}`;
                document.getElementById('enemies-left').innerText = `الأعداء: ${this.enemiesToSpawn + this.enemies.length + (this.boss?1:0)}`;
                document.getElementById('coins-text').innerText = `🪙 ${this.coins}`;
                document.getElementById('ammo-text').innerText = `${this.player.ammo} / ${WEAPONS.pistol.magSize}`;
            },

            gameOver(won) {
                this.isRunning = false;
                this.hideAll();
                const end = document.getElementById('menu-end');
                end.classList.remove('hidden');
                const title = document.getElementById('end-title');
                
                if(won) {
                    AudioFX.win();
                    title.innerText = "نجاح المهمة!";
                    title.style.color = "#22c55e";
                    title.style.textShadow = "0 0 20px rgba(34,197,94,0.5)";
                    if(this.currentLevel === this.maxLevel && this.maxLevel < 50) {
                        this.maxLevel++;
                    }
                } else {
                    AudioFX.lose();
                    title.innerText = "لقد قضي عليك!";
                    title.style.color = "#ef4444";
                    title.style.textShadow = "0 0 20px rgba(239,68,68,0.5)";
                }
            },

            drawBackground() {
                this.ctx.fillStyle = "#050b14";
                this.ctx.fillRect(0, 0, 1280, 720);
                
                const tileSize = 80;
                this.ctx.lineWidth = 1;
                
                for (let x = 0; x < 1280; x += tileSize) {
                    for (let y = 0; y < 720; y += tileSize) {
                        this.ctx.fillStyle = ((x/tileSize + y/tileSize) % 2 === 0) ? "#080f1c" : "#0c1526";
                        this.ctx.fillRect(x, y, tileSize, tileSize);
                        
                        this.ctx.strokeStyle = "#17253d";
                        this.ctx.strokeRect(x, y, tileSize, tileSize);
                        
                        this.ctx.strokeStyle = "#1e2f4c";
                        this.ctx.strokeRect(x + 10, y + 10, tileSize - 20, tileSize - 20);
                        
                        if ((x/tileSize + y/tileSize) % 3 === 0) {
                            this.ctx.fillStyle = "#38bdf8";
                            this.ctx.shadowColor = "#38bdf8";
                            this.ctx.shadowBlur = 12;
                            this.ctx.beginPath();
                            this.ctx.arc(x + tileSize/2, y + tileSize/2, 4, 0, Math.PI*2);
                            this.ctx.fill();
                            this.ctx.shadowBlur = 0;
                        }
                    }
                }
            },

            loop() {
                if (this.isRunning) {
                    this.update();
                    this.drawBackground();
                    this.draw();
                }
                requestAnimationFrame(() => this.loop());
            },

            update() {
                this.player.update();

                if (this.enemiesToSpawn > 0) {
                    this.spawnTimer++;
                    let spawnRate = Math.max(20, 50 - (this.currentLevel * 0.5));
                    
                    if (this.spawnTimer > spawnRate) {
                        const types = ['basic', 'fast', 'heavy', 'ranged', 'mutant'];
                        let availableTypes = Math.min(types.length, Math.ceil(this.currentLevel / 2));
                        const randomType = types[Math.floor(Math.random() * availableTypes)];
                        
                        let ex = Math.random() < 0.5 ? -50 : 1330;
                        let ey = Math.random() * 720;
                        
                        this.enemies.push(new Enemy(ex, ey, randomType, this.currentLevel));
                        this.enemiesToSpawn--;
                        this.spawnTimer = 0;
                    }
                }

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    b.update();
                    if (b.x < -100 || b.x > 1380 || b.y < -100 || b.y > 820) {
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    if (!b.isPlayer && this.player.checkCollision(b.x, b.y, b.size)) {
                        this.player.takeDamage(b.damage);
                        this.bullets.splice(i, 1);
                        continue;
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    let e = this.enemies[i];
                    e.update(this.player);

                    for (let j = this.bullets.length - 1; j >= 0; j--) {
                        let b = this.bullets[j];
                        if (b.isPlayer && e.checkCollision(b.x, b.y, b.size)) {
                            e.hp -= b.damage;
                            AudioFX.hit();
                            this.bullets.splice(j, 1);
                            if (e.hp <= 0) {
                                AudioFX.kill();
                                this.coins += 25;
                                this.enemies.splice(i, 1);
                                break;
                            }
                        }
                    }
                }

                if (this.boss) {
                    this.boss.update(this.player);
                    for (let j = this.bullets.length - 1; j >= 0; j--) {
                        let b = this.bullets[j];
                        if (b.isPlayer && this.boss.checkCollision(b.x, b.y, b.size)) {
                            this.boss.hp -= b.damage;
                            AudioFX.hit();
                            this.bullets.splice(j, 1);
                            if (this.boss.hp <= 0) {
                                AudioFX.kill();
                                this.coins += 500;
                                this.boss = null;
                                break;
                            }
                        }
                    }
                }

                if (this.enemiesToSpawn === 0 && this.enemies.length === 0 && !this.boss) {
                    this.gameOver(true);
                }

                this.updateHUD();
            },

            draw() {
                this.enemies.forEach(e => e.draw(this.ctx));
                if (this.boss) this.boss.draw(this.ctx);
                this.bullets.forEach(b => b.draw(this.ctx));
                this.player.draw(this.ctx);
            }
        };

        // --- PLAYER CLASS ---
        class Player {
            constructor(x, y) {
                this.x = x; this.y = y; this.w = 36; this.h = 36;
                this.hp = 150; this.maxHp = 150;
                this.speed = 5;
                this.ammo = WEAPONS.pistol.magSize;
                this.lastShot = 0;
                this.dashEnergy = 100;
                this.isDashing = false;
                this.dashTime = 0;
            }

            update() {
                if (Game.keys[' '] && this.dashEnergy === 100) {
                    this.isDashing = true;
                    this.dashEnergy = 0;
                    this.dashTime = Date.now();
                    AudioFX.dash();
                }
                if (this.isDashing && Date.now() - this.dashTime > 250) {
                    this.isDashing = false;
                }
                if (this.dashEnergy < 100) this.dashEnergy = Math.min(100, this.dashEnergy + 0.6);

                let currentSpeed = this.isDashing ? this.speed * 3.5 : this.speed;

                if (Game.keys['w'] || Game.keys['z']) this.y -= currentSpeed;
                if (Game.keys['s']) this.y += currentSpeed;
                if (Game.keys['a'] || Game.keys['q']) this.x -= currentSpeed;
                if (Game.keys['d']) this.x += currentSpeed;

                this.x = Math.max(20, Math.min(1260, this.x));
                this.y = Math.max(20, Math.min(700, this.y));

                if (Game.mouse.isDown && Date.now() - this.lastShot > WEAPONS.pistol.fireRate && this.ammo > 0) {
                    this.lastShot = Date.now();
                    this.ammo--;
                    AudioFX.shoot();
                    const angle = Math.atan2(Game.mouse.y - this.y, Game.mouse.x - this.x);
                    Game.bullets.push(new Bullet(this.x, this.y, angle, WEAPONS.pistol.damage, true));
                }

                if (this.ammo <= 0 && Date.now() - this.lastShot > WEAPONS.pistol.reloadTime) {
                    this.ammo = WEAPONS.pistol.magSize;
                }
            }

            takeDamage(dmg) {
                if(this.isDashing) return; 
                this.hp -= dmg;
                AudioFX.hit();
                if(this.hp <= 0) Game.gameOver(false);
            }

            checkCollision(x, y, r) {
                return (Math.abs(this.x - x) < this.w/2 + r && Math.abs(this.y - y) < this.h/2 + r);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                const angle = Math.atan2(Game.mouse.y - this.y, Game.mouse.x - this.x);
                ctx.rotate(angle);

                if(this.isDashing) {
                    ctx.fillStyle = "rgba(56, 189, 248, 0.4)";
                    ctx.beginPath(); ctx.arc(-25, 0, 18, 0, Math.PI*2); ctx.fill();
                }
                
                ctx.fillStyle = "#1e293b";
                ctx.beginPath(); ctx.roundRect(-10, -15, 20, 30, 5); ctx.fill();
                
                ctx.fillStyle = "#0f172a";
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#38bdf8"; 
                ctx.beginPath(); ctx.arc(4, 0, 8, -Math.PI/2, Math.PI/2); ctx.fill();

                ctx.fillStyle = "#64748b";
                ctx.fillRect(10, 5, 28, 7);
                ctx.fillStyle = "#38bdf8";
                ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 10;
                ctx.fillRect(34, 6, 4, 5); 
                ctx.shadowBlur = 0;

                ctx.restore();
            }
        }

        // --- ENEMY CLASS ---
        class Enemy {
            constructor(x, y, type, level) {
                this.x = x; this.y = y; this.type = type;
                this.lastAttack = 0; this.timeCreated = Date.now();
                
                let hpMultiplier = 1 + (level * 0.05);

                if (type === 'fast') { this.hp=40 * hpMultiplier; this.speed=4.8; this.color='#facc15'; this.r=14; }
                else if (type === 'heavy') { this.hp=250 * hpMultiplier; this.speed=1.6; this.color='#22c55e'; this.r=22; }
                else if (type === 'ranged') { this.hp=65 * hpMultiplier; this.speed=2.5; this.color='#a855f7'; this.r=16; }
                else if (type === 'mutant') { this.hp=130 * hpMultiplier; this.speed=3.0; this.color='#ec4899'; this.r=18; }
                else { this.hp=85 * hpMultiplier; this.speed=2.3; this.color='#ef4444'; this.r=16; } 
                
                this.maxHp = this.hp;
            }

            update(player) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx);
                this.facingAngle = angle;

                if (this.type === 'ranged') {
                    if (dist > 350) {
                        this.x += Math.cos(angle) * this.speed;
                        this.y += Math.sin(angle) * this.speed;
                    } else if (Date.now() - this.lastAttack > 1200) {
                        Game.bullets.push(new Bullet(this.x, this.y, angle, 15, false));
                        AudioFX.shoot();
                        this.lastAttack = Date.now();
                    }
                } else if (this.type === 'mutant') {
                    const zig = Math.sin((Date.now() - this.timeCreated) / 120) * 5;
                    this.x += Math.cos(angle) * this.speed + Math.cos(angle + Math.PI/2) * zig;
                    this.y += Math.sin(angle) * this.speed + Math.sin(angle + Math.PI/2) * zig;
                } else {
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }

                if (dist < this.r + 20 && Date.now() - this.lastAttack > 800 && this.type !== 'ranged') {
                    player.takeDamage(20);
                    this.lastAttack = Date.now();
                }
            }

            checkCollision(x, y, br) {
                return (Math.abs(this.x - x) < this.r + br && Math.abs(this.y - y) < this.r + br);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.facingAngle);

                if (this.type === 'heavy') {
                    ctx.fillStyle = "#166534";
                    ctx.beginPath(); ctx.roundRect(-20, -25, 40, 50, 8); ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.fillRect(0, -10, 25, 20);
                } 
                else if (this.type === 'fast') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-15, 15); ctx.lineTo(-15, -15); ctx.fill();
                }
                else if (this.type === 'mutant') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color; ctx.shadowBlur = 15;
                    ctx.beginPath();
                    let pulse = Math.sin(Date.now() / 100) * 4;
                    ctx.arc(0, 0, this.r + pulse, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(5, -8, 4, 4); ctx.fillRect(10, 5, 4, 4); ctx.fillRect(2, 6, 4, 4);
                }
                else if (this.type === 'ranged') {
                    ctx.fillStyle = "#334155";
                    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(8, 0, 5, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = this.color; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(38, 0); ctx.stroke(); 
                }
                else {
                    ctx.fillStyle = "#475569";
                    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.fillRect(5, -5, 15, 10);
                }

                ctx.restore();

                ctx.fillStyle = "#000";
                ctx.fillRect(this.x - 15, this.y - this.r - 12, 30, 6);
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(this.x - 15, this.y - this.r - 12, (this.hp/this.maxHp)*30, 6);
            }
        }

        // --- BOSS CLASS ---
        class Boss {
            constructor(x, y, level) {
                this.x = x; this.y = y; this.r = 45;
                this.hp = 1000 + (level * 200); 
                this.maxHp = this.hp;
                this.lastAttack = 0;
                this.phase = 1;
            }

            update(player) {
                this.phase = this.hp < (this.maxHp / 2) ? 2 : 1;
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.facingAngle = angle;

                this.x += Math.cos(angle) * (this.phase === 2 ? 2.0 : 1.2);
                this.y += Math.sin(angle) * (this.phase === 2 ? 2.0 : 1.2);

                if (Date.now() - this.lastAttack > (this.phase === 2 ? 700 : 1200)) {
                    let spread = this.phase === 2 ? 2 : 1;
                    for(let i = -spread; i <= spread; i++) {
                        Game.bullets.push(new Bullet(this.x, this.y, angle + (i * 0.2), 25, false));
                    }
                    AudioFX.shoot();
                    this.lastAttack = Date.now();
                }
            }

            checkCollision(x, y, br) {
                return (Math.abs(this.x - x) < this.r + br && Math.abs(this.y - y) < this.r + br);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.facingAngle);

                ctx.fillStyle = "#0f172a";
                ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(-35, 45); ctx.lineTo(-35, -45); ctx.fill();
                
                ctx.fillStyle = this.phase === 2 ? "#ef4444" : "#eab308";
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 25;
                ctx.beginPath(); ctx.arc(15, 0, 18, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 25, 55, 18);
                ctx.fillRect(0, -43, 55, 18);

                ctx.restore();

                ctx.fillStyle = "#000"; ctx.fillRect(this.x - 50, this.y - 70, 100, 10);
                ctx.fillStyle = this.phase === 2 ? "#ef4444" : "#facc15"; 
                ctx.fillRect(this.x - 50, this.y - 70, (this.hp/this.maxHp)*100, 10);
            }
        }

        // --- BULLET CLASS ---
        class Bullet {
            constructor(x, y, angle, dmg, isPlayer) {
                this.x = x; this.y = y; this.damage = dmg; this.isPlayer = isPlayer;
                this.speed = isPlayer ? 22 : 8;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.size = 5;
            }
            update() { this.x += this.vx; this.y += this.vy; }
            draw(ctx) {
                ctx.fillStyle = this.isPlayer ? "#38bdf8" : "#ef4444";
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        window.onload = () => Game.init();
    </script>
</body>
